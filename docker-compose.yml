services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: dbms10
      POSTGRES_PASSWORD: dbms10pass
      POSTGRES_DB: blutspende
    ports:
      - "5433:5432"
    volumes:
      - ./system/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
